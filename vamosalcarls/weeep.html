<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vamos al Carls</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #ffcc00,
                #ff8c00,
                #ff4500
            );
        }

        .card {
            width: 90%;
            max-width: 600px;

            padding: 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.25);

            
        }

       

        h1 {
            margin-bottom: 25px;

            font-size: 42px;

            color: #d68b28;

            text-shadow:
                2px 2px 0px #837023;
        }

        .card img {
            width: 100%;
            max-width: 500px;

            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

          
        }

        

        .mensaje {
            margin-top: 20px;

            font-size: 20px;
            font-weight: bold;

            color: #333;
        }

        .boton {
            display: inline-block;

            margin-top: 25px;
            padding: 14px 30px;

            background: #f06868;
            color: rgb(204, 113, 178);

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 50px;

            transition: all 0.3s ease;
        }

        .boton:hover {
            background: #cc3c3c;

            transform: scale(1.05);

            box-shadow:
                0 8px 20px rgba(214, 40, 40, 0.4);
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }

            .mensaje {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Vamos al Carls 🙏</h1>

        <img src="images.jpeg" alt="Vamos al Carls">

        

        <a href="#" class="boton">
            VAMOS
        </a>

    </div>

</body>
</html>
